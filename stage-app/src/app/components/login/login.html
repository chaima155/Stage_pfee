<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<div class="login-container">
    <div class="login-card">
        <div class="login-header">
            <div class="login-icon">
                <i class="fa-solid fa-user-lock"></i>
            </div>
            <h2>Connexion</h2>
            <p>Accédez à votre espace personnel</p>
        </div>

        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
            <div class="form-group">
                <label for="email">
                    <i class="fa-solid fa-envelope"></i> Email
                </label>
                <input type="email" id="email" formControlName="email" placeholder="votre@email.com"
                    [class.input-error]="loginForm.get('email')?.touched && loginForm.get('email')?.invalid" />
                <span class="error-text"
                    *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.hasError('required')">
                    L'email est requis
                </span>
                <span class="error-text"
                    *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.hasError('email')">
                    Format d'email invalide
                </span>
            </div>

            <div class="form-group">
                <label for="motDePasse">
                    <i class="fa-solid fa-lock"></i> Mot de passe
                </label>
                <input 
                type="password" 
                id="motDePasse" 
                formControlName="motDePasse" 
                placeholder="••••••••"
                autocomplete="current-password"
                [class.input-error]="loginForm.get('motDePasse')?.touched && loginForm.get('motDePasse')?.invalid"
                />
                <span class="error-text"
                    *ngIf="loginForm.get('motDePasse')?.touched && loginForm.get('motDePasse')?.hasError('required')">
                    Le mot de passe est requis
                </span>
            </div>

            <div class="error-banner" *ngIf="errorMessage">
                <i class="fa-solid fa-circle-exclamation"></i>
                {{ errorMessage }}
            </div>

            <button type="submit" class="btn-login" [disabled]="isSubmitting">
                <i class="fa-solid fa-right-to-bracket" *ngIf="!isSubmitting"></i>
                <i class="fa-solid fa-spinner fa-spin" *ngIf="isSubmitting"></i>
                {{ isSubmitting ? 'Connexion...' : 'Se connecter' }}
            </button>
        </form>

        <div class="login-footer">
            <p>Pas encore de compte ? <a routerLink="/register-candidate">S'inscrire</a></p>
        </div>
    </div>
</div>
