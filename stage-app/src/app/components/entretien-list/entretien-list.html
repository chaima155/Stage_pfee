<table *ngIf="!loading && entretiens.length > 0" class="entretien-table">
  <thead>
    <tr>
      <th>#</th>
      <th>📅 Date</th>
      <th>🕐 Heure</th>
      <th>👤 Candidat</th>
      <th>📌 Statut</th>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let e of entretiens; let i = index">
      <td>{{ i + 1 }}</td>
      <td>{{ e.date | date:'dd/MM/yyyy' }}</td>
      <td>{{ e.date | date:'HH:mm' }}</td>

      <!-- ✅ Colonne candidat -->
      <td>
        <ng-container *ngIf="e.candidature?.candidate; else noCandidat">
          <div class="candidate-info">
            <span class="candidate-name">
              {{ e.candidature.candidate.prenom }} {{ e.candidature.candidate.nom }}
            </span>
            <span class="candidate-email">
              {{ e.candidature.candidate.email }}
            </span>
          </div>
        </ng-container>
        <ng-template #noCandidat>
          <span class="no-candidate">—</span>
        </ng-template>
      </td>

      <!-- Statut -->
      <td>
        <span class="badge-disponible"   *ngIf="e.disponible">✅ Disponible</span>
        <span class="badge-indisponible" *ngIf="!e.disponible">❌ Non disponible</span>
      </td>

      <!-- Actions -->
      <td class="actions">
        <button class="btn-delete" (click)="deleteEntretien(e.id)">
          🗑 Supprimer
        </button>
      </td>
    </tr>
  </tbody>
</table>

<!-- Chargement -->
<div *ngIf="loading" class="loading">
  <p>Chargement...</p>
</div>

<!-- Aucun entretien -->
<div *ngIf="!loading && entretiens.length === 0" class="empty">
  <p>Aucun entretien trouvé.</p>
</div>
