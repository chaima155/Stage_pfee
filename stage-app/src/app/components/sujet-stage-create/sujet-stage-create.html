<div class="create-page">
  <!-- En-tête avec titre -->
  <div class="page-title-section">
    <h2 class="main-title">Ajouter un Sujet de Stage</h2>
    <p class="title-sub">Remplissez les informations ci-dessous pour créer un nouveau sujet</p>
  </div>

  <!-- Formulaire -->
  <div class="form-wrapper">
    <form #form="ngForm" (ngSubmit)="saveSujet()" class="professional-form">

      <!-- Titre -->
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">
            Titre <span class="required">*</span>
          </label>
          <input
            type="text"
            class="form-control"
            [(ngModel)]="sujet.titre"
            name="titre"
            required
            placeholder="Ex: Développement d'une application web"
          >
          <small class="form-text" *ngIf="form.submitted && !sujet.titre" class="error-text">
            Le titre est obligatoire
          </small>
        </div>
      </div>

      <!-- Description -->
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">
            Description <span class="required">*</span>
          </label>
          <textarea
            class="form-control textarea"
            [(ngModel)]="sujet.description"
            name="description"
            required
            rows="5"
            placeholder="Décrivez le sujet en détail..."
          ></textarea>
        </div>
      </div>

      <!-- Mots Clés et Nombre stagiaires (2 colonnes) -->
      <div class="form-row double">
        <div class="form-group">
          <label class="form-label">Mots Clés</label>
          <input
            type="text"
            class="form-control"
            [(ngModel)]="sujet.motsCles"
            name="motsCles"
            placeholder="web, mobile, IA, ..."
          >
          <small class="form-hint">Séparés par des virgules</small>
        </div>

        <div class="form-group">
          <label class="form-label">Nombre de stagiaires</label>
          <input
            type="number"
            class="form-control"
            [(ngModel)]="sujet.nbrStagiaires"
            name="nbrStagiaires"
            min="1"
            value="1"
          >
        </div>
      </div>

      <!-- Niveau et Durée (2 colonnes) -->
      <div class="form-row double">
        <div class="form-group">
          <label class="form-label">Niveau</label>
          <select class="form-control" [(ngModel)]="sujet.niveau" name="niveau">
            <option value="" disabled selected>Choisir un niveau</option>
            <option value="Licence 1">Licence 1</option>
            <option value="Licence 2">Licence 2</option>
            <option value="Licence 3">Licence 3</option>
            <option value="Master 1">Master 1</option>
            <option value="Master 2">Master 2</option>
            <option value="Ingénieur">Ingénieur</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label">Durée (mois)</label>
          <input
            type="number"
            class="form-control"
            [(ngModel)]="sujet.duree"
            name="duree"
            min="1"
            max="12"
            value="6"
          >
        </div>
      </div>

      <!-- Technologies -->
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Technologies</label>
          <input
            type="text"
            class="form-control"
            [(ngModel)]="sujet.technologies"
            name="technologies"
            placeholder="Java, Spring Boot, Angular, MySQL, ..."
          >
          <small class="form-hint">Séparées par des virgules</small>
        </div>
      </div>

      <!-- Aperçu des technologies (optionnel) -->
      <div class="form-row" *ngIf="sujet.technologies">
        <div class="tags-container">
          <span class="tag" *ngFor="let tech of getTechnologiesList()">
            {{ tech.trim() }}
          </span>
        </div>
      </div>

      <!-- Bouton d'ajout -->
      <div class="form-row submit-row">
        <button type="submit" class="btn-submit" [disabled]="form.invalid && form.submitted">
          <span class="btn-icon">+</span>
          Ajouter le sujet
        </button>
      </div>

      <!-- Message de succès (optionnel) -->
      <div class="form-row" *ngIf="showSuccessMessage">
        <div class="success-message">
          ✓ Sujet ajouté avec succès !
        </div>
      </div>

    </form>
  </div>
</div>
