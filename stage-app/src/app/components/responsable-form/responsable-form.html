<div class="login-container">
  <div class="login-wrapper">
    <div class="login-header">
      <i class="fa-solid fa-user-shield login-icon"></i>
      <h2>Espace Responsable</h2>
      <p class="subtitle">Connectez-vous pour accéder à votre tableau de bord.</p>
    </div>

    <div *ngIf="errorMessage" class="alert error-alert">
      <i class="fa-solid fa-circle-exclamation"></i> {{ errorMessage }}
    </div>

    <form [formGroup]="form" class="login-form">
      <div class="form-group">
        <label>Email *</label>
        <div class="input-icon-wrapper">
          <i class="fa-solid fa-envelope input-icon"></i>
          <input type="email" formControlName="email" placeholder="Votre email"
            [class.invalid]="form.get('email')?.invalid && form.get('email')?.touched">
        </div>
        <div class="error-text" *ngIf="form.get('email')?.invalid && form.get('email')?.touched">
          Email invalide.
        </div>
      </div>

      <div class="form-group">
        <label>Mot de passe *</label>
        <div class="input-icon-wrapper">
          <i class="fa-solid fa-lock input-icon"></i>
          <input type="password" formControlName="motDePasse" placeholder="Votre mot de passe"
            [class.invalid]="form.get('motDePasse')?.invalid && form.get('motDePasse')?.touched">
        </div>
        <div class="error-text" *ngIf="form.get('motDePasse')?.invalid && form.get('motDePasse')?.touched">
          Mot de passe requis.
        </div>
      </div>

      <button type="button" class="btn-submit" [disabled]="isSubmitting" (click)="onSubmit()">
        <span *ngIf="!isSubmitting"><i class="fa-solid fa-right-to-bracket"></i> Se connecter</span>
        <span *ngIf="isSubmitting"><i class="fa-solid fa-spinner fa-spin"></i> Connexion...</span>
      </button>
    </form>
  </div>
</div>
