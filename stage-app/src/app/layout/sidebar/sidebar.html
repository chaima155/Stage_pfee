<aside class="sidebar">
  <div class="sidebar-header">
    <div class="sidebar-logo">
      <i class="fas fa-cube"></i>
      <span>DASHMIN</span>
    </div>
  </div>

  <!-- PROFILE -->
  <div class="profile-card" (click)="goToResponsableEdit()">
    <div class="profile-left">
      <div class="avatar" *ngIf="!responsablePhoto">{{ responsableInitiale }}</div>
      <img *ngIf="responsablePhoto" [src]="responsablePhoto"
           class="avatar avatar-img" alt="photo" />
      <div class="profile-info">
        <h4>{{ responsableNom }}</h4>
        <p><i class="fas fa-user"></i> Responsable</p>
      </div>
    </div>
    <div class="profile-arrow">
      <i class="fas fa-chevron-right"></i>
    </div>
  </div>

  <!-- MENU -->
  <div class="sidebar-menu">
    <ul class="nav-list">

      <li class="nav-item">
        <a class="nav-link">
          <i class="fas fa-tachometer-alt"></i>
          <span>Dashboard</span>
        </a>
      </li>

      <li class="nav-item has-submenu">
        <a class="nav-link">
          <i class="fas fa-file"></i>
          <span>Sujet De Stage</span>
          <i class="fas fa-chevron-right arrow"></i>
        </a>
        <ul class="submenu">
          <li><a class="nav-link" (click)="goToCreate(); $event.stopPropagation()">Nouvel sujet</a></li>
          <li><a class="nav-link" (click)="goToList(); $event.stopPropagation()">Liste des sujets</a></li>
        </ul>
      </li>

      <li class="nav-item has-submenu">
        <a class="nav-link">
          <i class="fas fa-file"></i>
          <span>Les dates d'entretien</span>
          <i class="fas fa-chevron-right arrow"></i>
        </a>
        <ul class="submenu">
          <li><a class="nav-link" (click)="goToCreateEntretien(); $event.stopPropagation()">Nouvelle date</a></li>
          <li><a class="nav-link" (click)="goToListentretien(); $event.stopPropagation()">Liste des entretiens</a></li>
        </ul>
      </li>

      <li class="nav-item">
        <a class="nav-link" (click)="goToListcandidature()">
          <i class="fas fa-file-alt"></i>
          <span>Liste des candidatures</span>
        </a>
      </li>

      <!-- ✅ Mon Compte -->
      <li class="nav-item">
        <a class="nav-link" (click)="goToResponsableEdit()">
          <i class="fas fa-user-gear"></i>
          <span>Mon Compte</span>
        </a>
      </li>

      <li class="nav-item">
        <a class="nav-link">
          <i class="fas fa-table"></i>
          <span>Tables</span>
        </a>
      </li>

      <li class="nav-item">
        <a class="nav-link">
          <i class="fas fa-chart-line"></i>
          <span>Charts</span>
        </a>
      </li>

    </ul>
  </div>
</aside>
